name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache the extracted xcframework — it's ~200 MB and changes only when
      # PYTHON_VERSION or BEEWARE_BUILD change in the Makefile.
      - name: Cache Python.xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: Artifacts/Python.xcframework
          key: python-xcframework-cfabric-3.13-b13

      # On cache miss: extract and install cfabric into the embedded site-packages.
      # Both steps are cached together so cfabric is available on cache hit too.
      - name: Extract Python.xcframework
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: make extract

      - name: Install cfabric into embedded interpreter
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: make install-cfabric

      - name: Build
        run: swift build

      - name: Test
        run: swift test
