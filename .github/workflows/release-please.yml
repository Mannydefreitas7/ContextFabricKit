name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

  # Runs only when release-please merges a release PR and creates a tag.
  # Re-runs CI on the tagged commit as a final gate before the release goes live.
  verify:
    name: Verify Release Build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Cache Python.xcframework
        id: cache-xcframework
        uses: actions/cache@v4
        with:
          path: Artifacts/Python.xcframework
          key: python-xcframework-cfabric-3.13-b13

      - name: Extract Python.xcframework
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: make extract

      - name: Install cfabric into embedded interpreter
        if: steps.cache-xcframework.outputs.cache-hit != 'true'
        run: make install-cfabric

      - name: Build
        run: swift build

      - name: Test
        run: swift test
